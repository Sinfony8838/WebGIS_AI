<text x="38" y="780" font-size="18" fill="#17384b" text-anchor="start" font-weight="400">原表总计 124.25 万人；街道加总 124.26 万人，保留原表精度与总计。</text>
<text x="38" y="810" font-size="16" fill="#526979" text-anchor="start" font-weight="400">来源：杨浦区统计局：第7次人口普查杨浦区各街道数据；2023-04-20</text>
