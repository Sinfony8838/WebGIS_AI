<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="850" viewBox="0 0 1200 850" role="img" aria-labelledby="title desc">
<title id="title">杨浦区各街道常住人口 2020</title>
<desc id="desc">人口总量统计图，非人口密度。数据为2020年人口普查常住人口，网页答复日期为2023年4月20日。；原表以万人保留两位小数；街道加总124.26万人，公布总计124.25万人，保留两者。；比较的是人口总量；没有同期面积，不能据此判断人口密度。</desc>
